plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// Testes automáticos num servidor real (fora do jar final).
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

// 0.4.0: primeiro código de cliente (balões de emoção e falas por cima dos aldeões); o resto continua no servidor.
loom {
	splitEnvironmentSourceSets()

	mods {
		"tvilas" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"tvilas-gametest" {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		gametest {
			server()
			name "Game Test"
			source sourceSets.gametest
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest/junit.xml"
			runDir "build/gametest"
		}
		clientGameTest {
			client()
			name "Client Game Test"
			source sourceSets.gametest
			vmArg "-Dfabric.client.gametest"
			runDir "build/clientgametest"
		}
	}
}

// testes de cliente: precisam das classes do cliente
sourceSets.gametest {
	compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output
	runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output
}

/** O jar atual de um mod irmão (versão do gradle.properties dele); se ainda não foi construído, o mais recente em build/libs. */
def siblingJar(String dir, String name) {
	// 0.4.0: -Ppublished usa os jars publicados para os amigos (~/Downloads/Mods_Tcordeiro_MC26.3), os do jogo do Talys
	if (project.hasProperty('published')) {
		def pub = file("${System.getProperty('user.home')}/Downloads/Mods_Tcordeiro_MC26.3")
		def j = (pub.listFiles() ?: [] as File[]).findAll { it.name ==~ /${name}-[0-9.]+\.jar/ }.max { it.lastModified() }
		return files(j ?: [])
	}
	def props = new Properties()
	def propsFile = file("${rootDir}/../${dir}/gradle.properties")
	if (propsFile.exists()) propsFile.withInputStream { props.load(it) }
	def libs = file("${rootDir}/../${dir}/build/libs")
	def jar = new File(libs, "${name}-${props.getProperty('version')}.jar")
	if (!jar.exists()) {
		jar = (libs.listFiles() ?: [] as File[]).findAll { it.name ==~ /${name}-[0-9.]+\.jar/ }.max { it.lastModified() }
	}
	return files(jar ?: [])
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// CubCoin (opcional): com ele instalado as missões pagam também em CubCoins.
	// Só para compilar compat/CubCoinPay, que só é carregada se o CubCoin existir.
	def cubcoin = siblingJar("cubcoin", "cubcoin")
	compileOnly cubcoin
	// Testes de servidor com os mods opcionais (0.2.0: vendedores, móveis nas estruturas, iluminação):
	//   ./gradlew runGametest              com CubCoin, Industrial, Forja e Móveis
	//   ./gradlew runGametest -PnoCubcoin  sem o CubCoin (só esmeraldas), com os outros
	//   ./gradlew runGametest -PnoMods     sem nenhum mod opcional (só vanilla)
	boolean noMods = project.hasProperty('noMods')
	if (!project.hasProperty('noCubcoin') && !noMods) gametestRuntimeOnly cubcoin
	if (!noMods) {
		gametestRuntimeOnly siblingJar("tcordeiro-industrial", "tcordeiro-industrial") // 0.11+: postes e fio aéreo
		gametestRuntimeOnly siblingJar("tcordeiro-forja", "tcordeiro-forja")
		gametestRuntimeOnly siblingJar("tcordeiro-moveis", "tcordeiro-moveis")
		gametestRuntimeOnly siblingJar("tcordeiro-clima", "tcordeiro-clima") // 0.4.0: frio → lareira (ClimaApi por reflexão)
	}
	// 0.5.0: -Pemf junta o Entity Model Features e o Entity Texture Features do jogo do Talys (para ver as variáveis de gesto registadas)
	if (project.hasProperty('emf')) {
		def inst = file("${System.getProperty('user.home')}/Library/Application Support/horizon/instances/fabric/mods")
		gametestRuntimeOnly files((inst.listFiles() ?: [] as File[]).findAll { it.name.startsWith('entity_model_features') || it.name.startsWith('entity_texture_features') })
	}

	// Lógica pura (níveis, preços, lotes, alarme, missões): JUnit, sem servidor.
	testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:${project.junit_platform_version}"
}

test {
	useJUnitPlatform()
	testLogging { events "failed"; exceptionFormat "full" }
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
